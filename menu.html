<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menü — Ali Usta Baklavaları</title>
<meta name="description" content="Ali Usta Baklavaları menüsü — çeşitler, fotoğraflar ve güncel kilo fiyatları.">
<meta name="theme-color" content="#120C06">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* Menü sayfası kendi başına — site.js'in scroll/animasyon sistemine bağlı değil. */
  body{ overflow-x:hidden; }
  .menu-wrap{ max-width:1080px; margin-inline:auto; padding:clamp(2rem,6vw,4rem) var(--shell) clamp(4rem,8vw,6rem); }

  .menu-head{ text-align:center; padding-block:clamp(2.5rem,7vw,4rem) clamp(2rem,5vw,3rem); }
  .menu-logo{ font-family:var(--f-disp); font-variation-settings:"SOFT" 30,"WONK" 1; color:var(--gold-lit); font-size:1.05rem; letter-spacing:.06em; text-transform:uppercase; margin-bottom:.9rem; }
  .menu-h1{ font-family:var(--f-disp); font-variation-settings:"SOFT" 40,"WONK" 1,"opsz" 96; font-size:clamp(2.1rem,4vw + 1rem,3.4rem); color:var(--cream); margin:.3rem 0 .6rem; }
  .menu-diamond{ width:.5rem; height:.5rem; background:var(--gold); margin:1.6rem auto 0; transform:rotate(45deg); }

  .menu-admin-btn{
    position:fixed; top:1rem; right:1rem; z-index:5; padding:.5rem 1rem;
    font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700;
    color:var(--cream-mute); background:var(--ink-2); border:1px solid var(--line-soft); border-radius:2rem;
    cursor:pointer; transition:color .3s var(--ease), border-color .3s var(--ease);
  }
  .menu-admin-btn:hover{ color:var(--gold-lit); border-color:var(--line); }

  /* -------- kategori bölümü -------- */
  .menu-cat{ padding-top:clamp(3.2rem,7vw,4.6rem); border-top:1px solid var(--line-soft); margin-top:clamp(3.2rem,7vw,4.6rem); }
  .menu-cat:first-of-type{ border-top:0; margin-top:0; }
  .menu-cat-head{ text-align:center; max-width:38rem; margin-inline:auto clamp(1rem,3vw,1.6rem); }
  .menu-cat-no{ font-family:var(--f-body); font-size:.7rem; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .menu-cat h2{ font-family:var(--f-disp); font-variation-settings:"SOFT" 34,"WONK" 1,"opsz" 96; font-size:clamp(1.7rem,2.4vw + 1rem,2.4rem); color:var(--cream); margin:.5rem 0 .5rem; }
  .menu-cat-kicker{ color:var(--cream-mute); font-size:.88rem; line-height:1.6; }

  /* -------- fiyatlı ürün kartları -------- */
  .menu-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:1rem 1.6rem; margin-top:clamp(2rem,4vw,2.6rem); }
  .menu-card{ display:flex; gap:.9rem; align-items:flex-start; padding-bottom:1rem; border-bottom:1px solid var(--line-soft); }
  .menu-card-ph{ flex:none; width:4.6rem; height:4.6rem; border-radius:.35rem; overflow:hidden; background:var(--ink-3); border:1px solid var(--line-soft); cursor:zoom-in; }
  .menu-card-ph img{ width:100%; height:100%; object-fit:cover; display:block; }

  #menuLb{
    position:fixed; inset:0; z-index:50; background:rgba(7,4,2,.94);
    display:flex; align-items:center; justify-content:center; padding:2rem;
    backdrop-filter:blur(6px);
  }
  #menuLb img{ max-width:min(90vw,720px); max-height:88vh; width:auto; height:auto; border-radius:.4rem; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #menuLbClose{
    position:fixed; top:1rem; right:1.2rem; width:2.6rem; height:2.6rem; border-radius:50%;
    background:var(--ink-2); border:1px solid var(--line); color:var(--cream); font-size:1.3rem; cursor:pointer;
  }
  #menuLbClose:hover{ color:var(--gold-lit); }
  .menu-card-body{ flex:1; min-width:0; }
  .menu-card{ position:relative; }
  .menu-card-top{ display:flex; justify-content:space-between; align-items:baseline; gap:.6rem; }
  .menu-card-name{ font-family:var(--f-disp); font-size:1.05rem; color:var(--cream); }
  .menu-card-price-wrap{ display:inline-flex; align-items:center; gap:.35rem; }
  .menu-card-price{ font-family:var(--f-disp); font-size:1.05rem; color:var(--gold-lit); white-space:nowrap; }
  .menu-card-desc{ display:block; font-size:.82rem; color:var(--cream-mute); margin-top:.2rem; line-height:1.5; }
  .menu-card-unit{ display:block; font-size:.68rem; color:var(--cream-mute); text-align:right; margin-top:.1rem; }

  /* -------- yönetim (şifreli) -------- */
  .menu-edit-price{ font-size:.8rem; color:var(--cream-mute); background:none; border:0; cursor:pointer; line-height:1; }
  .menu-edit-price:hover{ color:var(--gold-lit); }
  .menu-del-item{
    position:absolute; top:-.4rem; right:-.4rem; width:1.4rem; height:1.4rem; line-height:1.4rem; text-align:center;
    border-radius:50%; background:var(--copper-dp); color:var(--cream); font-size:.8rem; border:0; cursor:pointer;
  }
  .menu-add-toggle{
    margin-top:1.2rem; padding:.55rem 1rem; font-size:.76rem; letter-spacing:.05em;
    color:var(--gold-lit); background:none; border:1px dashed var(--line); border-radius:.4rem; cursor:pointer;
  }
  .menu-add-toggle:hover{ border-color:var(--gold); }
  .menu-add-form{ margin-top:1rem; padding:1rem; border:1px solid var(--line-soft); border-radius:.5rem; background:var(--ink-2); }
  .menu-add-title{ font-size:.78rem; color:var(--cream-mute); margin-bottom:.7rem; }
  .menu-add-row{ display:flex; gap:.6rem; margin-bottom:.6rem; flex-wrap:wrap; }
  .menu-add-row input[type="text"]{
    flex:1; min-width:9rem; padding:.55rem .7rem; background:var(--ink-3); border:1px solid var(--line-soft);
    border-radius:.35rem; color:var(--cream); font-size:.86rem; font-family:var(--f-body);
  }
  .menu-add-row input[type="file"]{ flex:1; min-width:9rem; color:var(--cream-mute); font-size:.8rem; }
  .menu-add-submit{
    padding:.55rem 1.2rem; background:var(--gold); color:var(--pitch); border:0; border-radius:.35rem;
    font-weight:700; font-size:.82rem; cursor:pointer;
  }
  .menu-add-msg{ font-size:.78rem; color:var(--copper); margin:0; }

  .menu-note{ margin-top:clamp(3rem,6vw,4rem); padding-top:1.6rem; border-top:1px solid var(--line-soft); color:var(--cream-mute); font-size:.86rem; text-align:center; }
  .menu-foot{ margin-top:clamp(2.4rem,6vw,3.4rem); text-align:center; }
  .menu-foot a.mini{ display:inline-flex; align-items:center; gap:.5rem; padding:.85rem 1.6rem; border:1px solid var(--line); border-radius:2rem; color:var(--cream); text-decoration:none; font-size:.92rem; }
  .menu-foot a.mini:hover{ border-color:var(--gold); color:var(--gold-lit); }
  .menu-foot p{ margin-top:1rem; color:var(--cream-mute); font-size:.86rem; }

  @media (max-width:640px){
    .menu-grid{ grid-template-columns:1fr; }
  }
</style>
</head>
<body class="motion-off">

<button class="menu-admin-btn" id="menuAdminToggle" type="button">Yönetim</button>

<main class="menu-wrap">
  <header class="menu-head">
    <div class="menu-logo">Ali Usta Baklavaları</div>
    <h1 class="menu-h1">Menü</h1>
    <div class="menu-diamond" aria-hidden="true"></div>
  </header>

  <div id="menuBody"></div>

  <p class="menu-note">Kesin tutar ve tepsi ölçüleri için WhatsApp'tan teyit alınız. Mevsimlik/özel çeşitlerin fiyatı için lütfen sorunuz. Fiyatlar önceden haber verilmeksizin güncellenebilir.</p>

  <div class="menu-foot">
    <a class="mini" id="menuWa" href="#" target="_blank" rel="noopener">WhatsApp'tan Sipariş</a>
    <p id="menuAdres"></p>
  </div>
</main>

<div id="menuLb" hidden>
  <button id="menuLbClose" type="button" aria-label="Kapat">×</button>
  <img id="menuLbImg" src="" alt="">
</div>

<script src="assets/js/config.js?v=53"></script>
<script src="assets/js/media.js?v=53"></script>
<script src="assets/js/menu.js?v=53"></script>
</body>
</html>
